<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>40º Aniversario · IES Andrés Benítez</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #2B1720;
      font-family: Arial, Helvetica, sans-serif;
    }
    #info {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      max-width: 360px;
      padding: 14px 16px;
      color: white;
      background: rgba(5, 12, 24, .84);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    #info strong {
      display: block;
      margin-bottom: 7px;
      color: #B58A5A;
      font-size: 17px;
    }
    #info span {
      display: block;
      margin-top: 4px;
      color: #E7D8BF;
      font-size: 13px;
      line-height: 1.4;
    }
    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      margin: -4px;
      z-index: 5;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 50%;
      pointer-events: none;
    }
    #museum-panel {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      width: min(520px, calc(100vw - 40px));
      padding: 22px;
      color: white;
      background: rgba(7, 17, 31, .94);
      border: 1px solid rgba(240, 138, 60, .5);
      border-radius: 16px;
      box-shadow: 0 20px 70px rgba(0,0,0,.55);
      display: none;
    }
    #museum-panel h2 {
      margin: 0 0 8px;
      color: #B58A5A;
      font-size: 22px;
    }
    #museum-panel p {
      margin: 7px 0;
      color: #E7D8BF;
      line-height: 1.5;
      font-size: 14px;
    }
    #museum-close {
      margin-top: 14px;
      padding: 9px 14px;
      border: 0;
      border-radius: 9px;
      background: #B58A5A;
      color: #2B1720;
      font-weight: bold;
      cursor: pointer;
    }
    #sound-toggle {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 12;
      padding: 9px 13px;
      border: 1px solid rgba(181,138,90,.7);
      border-radius: 999px;
      background: rgba(43,23,32,.88);
      color: #F5EFE5;
      font-size: 12px;
      cursor: pointer;
    }
    #message {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 10;
      padding: 9px 14px;
      color: white;
      background: rgba(5, 12, 24, .72);
      border-radius: 999px;
      font-size: 12px;
      pointer-events: none;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="info">
    <strong>40º ANIVERSARIO · IES ANDRÉS BENÍTEZ</strong>
    <span>Proyecto VR · El legado de Andrés Benítez</span><span>Vestíbulo · 40 años de historia</span>
    <span>Colisiones: ACTIVADAS</span>
    <span>PC: WASD + ratón · VR: joystick izquierdo</span>
  </div>

  <div id="crosshair"></div>
  <button id="sound-toggle" type="button">🔇 Sonido ambiente</button>

  <div id="museum-panel">
    <h2 id="museum-title"></h2>
    <p id="museum-author"></p>
    <p id="museum-description"></p>
    <p id="museum-curiosity"></p>
    <button id="museum-close">Cerrar</button>
  </div>

  <div id="message">Haz clic en la escena para mirar con el ratón</div>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2B1720);
    scene.fog = new THREE.Fog(0x2B1720, 10, 34);

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.05,
      100
    );
    camera.position.set(0, 1.6, 0);

    const dolly = new THREE.Group();
    dolly.add(camera);
    scene.add(dolly);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    let ambientAudio = null;

    function startAmbientSound() {
      if (ambientAudio) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;

      const audioContext = new AudioContext();
      const master = audioContext.createGain();
      master.gain.value = 0.035;
      master.connect(audioContext.destination);

      const drone = audioContext.createOscillator();
      const droneGain = audioContext.createGain();
      drone.type = 'sine';
      drone.frequency.value = 110;
      droneGain.gain.value = 0.22;
      drone.connect(droneGain);
      droneGain.connect(master);

      const filter = audioContext.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 420;

      const air = audioContext.createBufferSource();
      const buffer = audioContext.createBuffer(1, audioContext.sampleRate * 2, audioContext.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.018;
      air.buffer = buffer;
      air.loop = true;
      air.connect(filter);
      filter.connect(master);

      drone.start();
      air.start();

      ambientAudio = { audioContext, master, drone, air };
      document.getElementById('sound-toggle').textContent = '🔊 Sonido ambiente';
    }

    function stopAmbientSound() {
      if (!ambientAudio) return;
      ambientAudio.audioContext.close();
      ambientAudio = null;
      document.getElementById('sound-toggle').textContent = '🔇 Sonido ambiente';
    }

    document.getElementById('sound-toggle').addEventListener('click', () => {
      if (ambientAudio) stopAmbientSound();
      else startAmbientSound();
    });

    scene.add(new THREE.HemisphereLight(0xF1E5D2, 0x3B2029, 1.8));

    const mainLight = new THREE.DirectionalLight(0xF5EFE5, 2.2);
    mainLight.position.set(4, 9, 3);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.set(1024, 1024);
    mainLight.shadow.camera.left = -12;
    mainLight.shadow.camera.right = 12;
    mainLight.shadow.camera.top = 12;
    mainLight.shadow.camera.bottom = -12;
    scene.add(mainLight);

    const CELL_SIZE = 1.4;

    // Museo lineal: vestíbulo → Sala 1 → Sala 2 → Sala 3 → Sala 4 → salida.
    // Las aperturas centrales permiten avanzar de una sala a la siguiente.
    const GH = 9;
    const GW = 35;

    const grid = Array.from({ length: GH }, (_, gy) => {
      const row = Array(GW).fill('.');

      for (let gx = 0; gx < GW; gx++) {
        if (gx === 0 || gx === GW - 1 || gy === 0 || gy === GH - 1) {
          row[gx] = '#';
        }
      }

      [6, 11, 18, 23, 30, 33].forEach((wallX) => {
        if (wallX === 33 || gy !== 4) row[wallX] = '#';
      });

      return row.join('');
    });
    const PLAYER_RADIUS = 0.30;
    const WALL_HEIGHT = 3.6;

    function gridToWorld(gx, gy) {
      return {
        x: (gx - (GW - 1) / 2) * CELL_SIZE,
        z: (gy - (GH - 1) / 2) * CELL_SIZE
      };
    }

    function worldToGridApprox(x, z) {
      return {
        gx: Math.round(x / CELL_SIZE + (GW - 1) / 2),
        gy: Math.round(z / CELL_SIZE + (GH - 1) / 2)
      };
    }

    const wallMaterial = new THREE.MeshStandardMaterial({
      color: 0x6B2D3E,
      roughness: 0.78,
      metalness: 0.08
    });

    const obstacleMaterial = new THREE.MeshStandardMaterial({
      color: 0xB58A5A,
      roughness: 0.6,
      metalness: 0.12
    });

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x5B2939,
      roughness: 0.92,
      metalness: 0.02
    });

    const wallGeometry = new THREE.BoxGeometry(
      CELL_SIZE,
      WALL_HEIGHT,
      CELL_SIZE
    );

    const obstacleGeometry = new THREE.BoxGeometry(
      CELL_SIZE,
      1.8,
      CELL_SIZE
    );

    const floor = new THREE.Mesh(
      new THREE.BoxGeometry(GW * CELL_SIZE, 0.15, GH * CELL_SIZE),
      floorMaterial
    );
    floor.position.y = -0.08;
    floor.receiveShadow = true;
    scene.add(floor);

    for (let gy = 0; gy < GH; gy++) {
      for (let gx = 0; gx < GW; gx++) {
        if (grid[gy][gx] !== '#') continue;

        const p = gridToWorld(gx, gy);
        const isOuterWall =
          gx === 0 || gy === 0 || gx === GW - 1 || gy === GH - 1;

        const mesh = new THREE.Mesh(
          wallGeometry,
          wallMaterial
        );

        mesh.position.set(
          p.x,
          isOuterWall ? WALL_HEIGHT / 2 : 0.9,
          p.z
        );
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
      }
    }

    // Objetos expositivos sólidos: el visitante no puede atravesarlos.
    const solidExhibits = [];

    function isFree(x, z, radius) {
      const { gx, gy } = worldToGridApprox(x, z);

      for (let oy = -1; oy <= 1; oy++) {
        for (let ox = -1; ox <= 1; ox++) {
          const cx = gx + ox;
          const cy = gy + oy;

          if (cx < 0 || cy < 0 || cx >= GW || cy >= GH) continue;
          if (grid[cy][cx] !== '#') continue;

          const w = gridToWorld(cx, cy);
          const half = CELL_SIZE / 2;

          const closestX = Math.max(
            w.x - half,
            Math.min(x, w.x + half)
          );

          const closestZ = Math.max(
            w.z - half,
            Math.min(z, w.z + half)
          );

          const dx = x - closestX;
          const dz = z - closestZ;

          if (dx * dx + dz * dz < radius * radius) {
            return false;
          }
        }
      }

      // Colisión con piezas expositivas sólidas.
      for (const box of solidExhibits) {
        const closestX = Math.max(box.minX, Math.min(x, box.maxX));
        const closestZ = Math.max(box.minZ, Math.min(z, box.maxZ));
        const dx = x - closestX;
        const dz = z - closestZ;

        if (dx * dx + dz * dz < radius * radius) {
          return false;
        }
      }

      return true;
    }

    function tryMove(pos, dx, dz, radius) {
      if (isFree(pos.x + dx, pos.z, radius)) {
        pos.x += dx;
      }
      if (isFree(pos.x, pos.z + dz, radius)) {
        pos.z += dz;
      }
    }

    const start = gridToWorld(2, 6);
    dolly.position.set(start.x, 0, start.z);

    // ------------------------------------------------------------
    // ------------------------------------------------------------
    // MUSEO · VESTÍBULO Y SEÑALÉTICA
    // ------------------------------------------------------------

    function createCanvasTexture(width, height, draw) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      draw(ctx, width, height);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      texture.needsUpdate = true;
      return texture;
    }

    function createSignTexture(title, subtitle, accent = '#B58A5A') {
      return createCanvasTexture(1536, 700, (ctx, w, h) => {
        ctx.fillStyle = '#4A1F2D';
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = accent;
        ctx.lineWidth = 8;
        ctx.strokeRect(24, 24, w - 48, h - 48);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#F5EFE5';
        ctx.font = 'bold 86px Arial';
        ctx.fillText(title, w / 2, 270);

        ctx.fillStyle = accent;
        ctx.font = 'bold 44px Arial';
        ctx.fillText(subtitle, w / 2, 400);

        ctx.fillStyle = '#CDBFA8';
        ctx.font = '34px Arial';
        ctx.fillText('1725 → 1786 → 1986 → 2026', w / 2, 530);
      });
    }

    function addWallSign(gx, gy, title, subtitle, side = 'x+', width = 1.12, height = 0.56) {
      const wall = gridToWorld(gx, gy);
      const sign = new THREE.Mesh(
        new THREE.PlaneGeometry(width, height),
        new THREE.MeshBasicMaterial({
          map: createSignTexture(title, subtitle),
          side: THREE.DoubleSide
        })
      );

      // La señal se coloca directamente sobre la cara de una celda de pared.
      // Nunca se coloca en una celda de paso.
      const inset = 0.006;
      if (side === 'x+') {
        sign.position.set(wall.x + CELL_SIZE / 2 + inset, 1.82, wall.z);
        sign.rotation.y = Math.PI / 2;
      } else if (side === 'x-') {
        sign.position.set(wall.x - CELL_SIZE / 2 - inset, 1.82, wall.z);
        sign.rotation.y = -Math.PI / 2;
      } else if (side === 'z+') {
        sign.position.set(wall.x, 1.82, wall.z + CELL_SIZE / 2 + inset);
      } else {
        sign.position.set(wall.x, 1.82, wall.z - CELL_SIZE / 2 - inset);
        sign.rotation.y = Math.PI;
      }

      scene.add(sign);
      return sign;
    }

    // Gran título de bienvenida, centrado en el eje del vestíbulo.
    const heroTexture = createCanvasTexture(2400, 1000, (ctx, w, h) => {
      ctx.fillStyle = '#4A1F2D';
      ctx.fillRect(0, 0, w, h);

      const gradient = ctx.createLinearGradient(0, 0, w, h);
      gradient.addColorStop(0, '#183552');
      gradient.addColorStop(1, '#4A1F2D');
      ctx.fillStyle = gradient;
      ctx.fillRect(24, 24, w - 48, h - 48);

      ctx.strokeStyle = '#B58A5A';
      ctx.lineWidth = 10;
      ctx.strokeRect(48, 48, w - 96, h - 96);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#B58A5A';
      ctx.font = 'bold 64px Arial';
      ctx.fillText('40.º ANIVERSARIO', w / 2, 240);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 152px Arial';
      ctx.fillText('IES ANDRÉS BENÍTEZ', w / 2, 430);

      ctx.fillStyle = '#E7D8BF';
      ctx.font = '56px Arial';
      ctx.fillText('EL LEGADO DE ANDRÉS BENÍTEZ', w / 2, 570);

      ctx.strokeStyle = '#54708d';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(600, 660);
      ctx.lineTo(1800, 660);
      ctx.stroke();

      ctx.fillStyle = '#CDBFA8';
      ctx.font = '44px Arial';
      ctx.fillText('MUSEO VIRTUAL · UN RECORRIDO POR LA HISTORIA', w / 2, 770);
    });

    const heroPanel = new THREE.Mesh(
      new THREE.PlaneGeometry(2.55, 1.05),
      new THREE.MeshBasicMaterial({ map: heroTexture, side: THREE.DoubleSide })
    );
    const heroWall = gridToWorld(3, 0);
    heroPanel.position.set(
      heroWall.x,
      1.85,
      heroWall.z + CELL_SIZE / 2 + 0.045
    );
    scene.add(heroPanel);

    // Línea temporal centrada bajo el título.
    const timelineWidth = 2.40;
    const timelineTexture = createCanvasTexture(2400, 600, (ctx, w, h) => {
      ctx.fillStyle = '#5B2939';
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = '#B58A5A';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(240, 310);
      ctx.lineTo(2160, 310);
      ctx.stroke();

      const years = ['1725', '1786', '1986', '2026'];
      const labels = ['Nace', 'Fallece', 'Nace el IES', '40.º aniversario'];
      const xs = [240, 880, 1520, 2160];

      ctx.textAlign = 'center';
      xs.forEach((x, i) => {
        ctx.fillStyle = '#F5EFE5';
        ctx.font = 'bold 60px Arial';
        ctx.fillText(years[i], x, 176);

        ctx.fillStyle = '#B58A5A';
        ctx.beginPath();
        ctx.arc(x, 310, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#CDBFA8';
        ctx.font = '36px Arial';
        ctx.fillText(labels[i], x, 444);
      });
    });

    const timelinePanel = new THREE.Mesh(
      new THREE.PlaneGeometry(timelineWidth, 0.60),
      new THREE.MeshBasicMaterial({ map: timelineTexture, side: THREE.DoubleSide })
    );
    timelinePanel.position.set(
      heroWall.x,
      0.78,
      heroWall.z + CELL_SIZE / 2 + 0.045
    );
    scene.add(timelinePanel);

    // IDENTIFICACIÓN DE ESPACIOS
    // Cada cara identifica exactamente el espacio que queda detrás de ese muro.
    //
    // VESTÍBULO | muro 6 | SALA 1 | muro 11 | SALA 2 |
    // muro 18 | SALA 3 | muro 23 | SALA 4 | muro 30 | SALIDA | muro 33 | FIN

    // Muro 6 · VESTÍBULO / SALA 1
    addWallSign(6, 3, 'VESTÍBULO', '40 AÑOS DE HISTORIA', 'x-', 1.00, 0.46);
    addWallSign(6, 3, '01 · EL HOMBRE', '¿QUIÉN FUE ANDRÉS BENÍTEZ?', 'x+', 1.00, 0.46);

    // Muro 11 · SALA 1 / SALA 2
    addWallSign(11, 3, '01 · EL HOMBRE', '¿QUIÉN FUE ANDRÉS BENÍTEZ?', 'x-', 1.00, 0.46);
    addWallSign(11, 3, '02 · EL ARTISTA', 'SU TALLER Y SU OFICIO', 'x+', 1.00, 0.46);

    // Muro 18 · SALA 2 / SALA 3
    addWallSign(18, 3, '02 · EL ARTISTA', 'SU TALLER Y SU OFICIO', 'x-', 1.00, 0.46);
    addWallSign(18, 3, '03 · JEREZ', 'EL SIGLO XVIII', 'x+', 1.00, 0.46);

    // Muro 23 · SALA 3 / SALA 4
    addWallSign(23, 3, '03 · SUS OBRAS', 'EL LEGADO ARTÍSTICO', 'x-', 1.00, 0.46);
    addWallSign(23, 3, '04 · JEREZ', 'EL SIGLO XVIII', 'x+', 1.00, 0.46);

    // Muro 30 · SALA 4 / ZONA DE SALIDA
    addWallSign(30, 3, '04 · JEREZ', 'EL SIGLO XVIII', 'x-', 1.00, 0.46);
    addWallSign(30, 3, 'SALIDA', 'FIN DEL RECORRIDO', 'x+', 1.00, 0.46);

    // Muro 33 · cierre de la zona de salida
    addWallSign(33, 3, 'SALIDA', 'FIN DEL RECORRIDO', 'x-', 1.00, 0.46);

    // La línea temporal principal del vestíbulo es la única cronología visible.

    // ------------------------------------------------------------
    // VESTÍBULO · INTRODUCCIÓN
    // ------------------------------------------------------------

    function createInfoTexture(title, lines, accent = '#B58A5A') {
      return createCanvasTexture(1800, 1000, (ctx, w, h) => {
        ctx.fillStyle = '#4A1F2D';
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = accent;
        ctx.lineWidth = 8;
        ctx.strokeRect(36, 36, w - 72, h - 72);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // La cartela se compone como una pieza editorial:
        // título arriba y el bloque de contenido centrado en el espacio restante.
        ctx.fillStyle = accent;
        ctx.font = 'bold 68px Arial';
        ctx.fillText(title, w / 2, 118);

        ctx.strokeStyle = '#8B5A68';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(280, 174);
        ctx.lineTo(1520, 174);
        ctx.stroke();

        const visibleLines = lines.filter(Boolean);
        const maxTextWidth = w - 300;
        const baseFont = visibleLines.length >= 7 ? 48 : visibleLines.length >= 5 ? 54 : 60;
        const lineGap = visibleLines.length >= 7 ? 18 : 20;

        // Ajustamos automáticamente cada línea para que no quede ni diminuta
        // ni pegada al borde. Las líneas largas se parten en dos si hace falta.
        const wrapped = [];
        visibleLines.forEach((line) => {
          ctx.font = `${baseFont}px Arial`;
          const words = line.split(' ');
          let current = '';

          words.forEach((word) => {
            const candidate = current ? `${current} ${word}` : word;
            if (ctx.measureText(candidate).width <= maxTextWidth) {
              current = candidate;
            } else {
              if (current) wrapped.push(current);
              current = word;
            }
          });

          if (current) wrapped.push(current);
        });

        const lineHeight = baseFont + lineGap;
        const blockHeight = wrapped.length * lineHeight;
        const contentTop = 220;
        const contentBottom = 920;
        const availableHeight = contentBottom - contentTop;
        const firstY = contentTop + (availableHeight - blockHeight) / 2 + lineHeight / 2;

        ctx.fillStyle = '#F5EFE5';
        ctx.font = `${baseFont}px Arial`;

        wrapped.forEach((line, index) => {
          ctx.fillText(line, w / 2, firstY + index * lineHeight);
        });
      });
    }

    function createQuestionTexture(title, lines) {
      return createCanvasTexture(1800, 1000, (ctx, w, h) => {
        ctx.fillStyle = '#4A1F2D';
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = '#B58A5A';
        ctx.lineWidth = 8;
        ctx.strokeRect(36, 36, w - 72, h - 72);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.fillStyle = '#B58A5A';
        ctx.font = 'bold 72px Arial';
        ctx.fillText(title, w / 2, 130);

        ctx.strokeStyle = '#8B5A68';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(410, 184);
        ctx.lineTo(1390, 184);
        ctx.stroke();

        const visibleLines = lines.filter(Boolean);
        const maxTextWidth = w - 300;
        const baseFont = visibleLines.length >= 5 ? 52 : 58;
        const lineHeight = baseFont + 26;
        const wrapped = [];

        visibleLines.forEach((line) => {
          ctx.font = `${baseFont}px Arial`;
          const words = line.split(' ');
          let current = '';

          words.forEach((word) => {
            const candidate = current ? `${current} ${word}` : word;
            if (ctx.measureText(candidate).width <= maxTextWidth) {
              current = candidate;
            } else {
              if (current) wrapped.push(current);
              current = word;
            }
          });

          if (current) wrapped.push(current);
        });

        const blockHeight = wrapped.length * lineHeight;
        const contentTop = 230;
        const contentBottom = 920;

      if (keys.has('KeyS') || keys.has('ArrowDown')) forward -= 1;
      if (keys.has('KeyD') || keys.has('ArrowRight')) strafe += 1;
      if (keys.has('KeyA') || keys.has('ArrowLeft')) strafe -= 1;

      if (forward === 0 && strafe === 0) return;

      const length = Math.hypot(forward, strafe);
      forward /= length;
      strafe /= length;

      const speed = 0.075;

      const forwardVector = new THREE.Vector3(

      );

      const dx =
        (forwardVector.x * forward + rightVector.x * strafe) * speed;
      const dz =
        (forwardVector.z * forward + rightVector.z * strafe) * speed;

        const y = leftGamepad.axes[3] ?? leftGamepad.axes[1] ?? 0;
        const deadZone = 0.15;

        const moveX = Math.abs(x) > deadZone ? x : 0;
        const moveY = Math.abs(y) > deadZone ? y : 0;

        if (moveX !== 0 || moveY !== 0) {
          const speed = 0.045;

          const forward = new THREE.Vector3(
            -Math.sin(dolly.rotation.y), 0, -Math.cos(dolly.rotation.y)
          );
          const rightVector = new THREE.Vector3(
            Math.cos(dolly.rotation.y), 0, -Math.sin(dolly.rotation.y)
          );

          tryMove(
            dolly.position,
            (rightVector.x * moveX + forward.x * -moveY) * speed,
            (rightVector.z * moveX + forward.z * -moveY) * speed,
            PLAYER_RADIUS
          );
        }
      }

      if (rightGamepad && rightGamepad.axes.length >= 4) {
        const x = rightGamepad.axes[2] ?? rightGamepad.axes[0] ?? 0;
        if (Math.abs(x) > 0.2) {
          dolly.rotation.y -= x * 0.035;
        }
      }
    }

    const vrRaycaster = new THREE.Raycaster();

    controllers.forEach((controller) => {
      controller.addEventListener('selectstart', () => {
        startAmbientSound();
        const origin = new THREE.Vector3();
        const direction = new THREE.Vector3(0, 0, -1);

        controller.getWorldPosition(origin);
        direction.applyQuaternion(
          controller.getWorldQuaternion(new THREE.Quaternion())
        );

        vrRaycaster.set(origin, direction);

        const interactiveObjects = [artwork, ...timelineHotspots, ...vestibuleInteractive];
        const hits = vrRaycaster.intersectObjects(interactiveObjects, false);

        if (hits.length > 0) {
          const object = hits[0].object;
          if (object.userData.museum) showMuseumPanel(object.userData.museum);
          if (object.userData.timeline) showTimelinePanel(object.userData.timeline);
        }
      });
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function render() {
      updateDesktopMovement();
      updateVRMovement();
      renderer.render(scene, camera);
    }

    renderer.setAnimationLoop(render);
  </script>
</body>
</html>
